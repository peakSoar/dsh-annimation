# dsh-douyin-window bundle patch: mounts the plugin's host half (the fenced
# /douyin-window/config route) into the profile layer stack.
#
# Optional config row with the same id in the profile's cordis.patch.yml pins
# the page every window opens:
#
#   - id: douyin-window
#     config:
#       url: https://www.douyin.com/
#
- insert:
    - id: douyin-window
      name: "dsh-douyin-window"
